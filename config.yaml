# ValPulse 周度指数估值系统配置

percentile:
  window_years: 10          # 近10年分位窗口
  bands: [20, 70, 90]       # 分级阈值：<20 低估，20-70 合理，70-90 偏高，>90 高估
  min_samples: 30           # 窗口内最少样本数，不足则标注"数据不足"

fetch:
  interval_seconds: 8       # 乐咕接口请求间隔（该站限流敏感，勿调小）
  csrf_refresh_seconds: 100 # CSRF 令牌刷新间隔
  max_retries: 3            # 单接口失败重试次数
  backoff_seconds: [20, 45, 90]  # 重试退避

# A股指数：乐咕源（等权口径 PE-TTM / PB），历史约2005年至今
indexes:
