name: weekly-valuation

on:
  schedule:
    - cron: "0 0 * * 6"   # 每周六 00:00 UTC = 北京时间 08:00
  workflow_dispatch:       # 允许在 Actions 页面手动触发

permissions:
  contents: write          # 允许推送快照回 main 及部署 Pages

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # 乐咕限速抓取约需 10-20 分钟，留足余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          sudo fc-cache -fv

      - name: 运行估值流水线
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python -m src.pipeline

      - name: 检查报告产物
        run: |
          test -f reports/index.html || { echo "报告未生成"; exit 1; }
          ls reports/

      - name: 提交快照回 main（供下周环比，失败不阻塞部署）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --staged --quiet; then
            echo "快照无变化"
          elif git commit -m "chore: 估值快照 $(date -u +%F)" && git push; then
            echo "快照已回推"
          else
            echo "::warning::快照回推失败，本周环比将缺失，不影响报告与部署"
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true
